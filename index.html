<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WBC Flow</title>
<style>
:root{--cw:min(calc(100% - 56px),360px);--pw:min(100%,340px);--iw:min(100%,360px);--hw:min(100%,360px);--bg:#f7f8f5;--card:#fff;--ink:#1f2b20;--mute:#66726a;--line:#d3dacd;--acc:#3f7d3c;--ok-bg:#dcefd8;--ok-ln:#86bd80;--ok-ink:#1d5a29;--bad-bg:#fbe6e2;--bad-ln:#e3aaa0;--shadow:0 1px 2px rgba(35,60,35,.06),0 8px 18px -10px rgba(35,60,35,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#app{height:100%;display:flex;flex-direction:column}
header{flex:none;background:#2e5a2e;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(30,60,30,.25)}
#bBack{flex:none;width:40px;height:40px;margin-left:-6px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;visibility:hidden}
#bBack:active{background:rgba(255,255,255,.3)}
.card.t-start{background:#e4efe0;border-color:#b3cfae;color:#2e5a2e;cursor:default}
header h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.01em}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 16px 12px;max-width:660px;width:100%;margin:0 auto}
#list{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:flex-start;padding-top:6px;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 auto;width:var(--cw);max-width:100%;display:flex;align-items:center;gap:10px;padding:18px 20px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);font-size:17.5px;line-height:1.35;font-weight:560;cursor:pointer;animation:in .5s cubic-bezier(.3,.8,.3,1) both;transition:opacity .3s,transform .3s}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.card.go{--blink:#3f7d3c;animation:in .5s cubic-bezier(.3,.8,.3,1) both,blink 1.3s ease-in-out .6s infinite}
@keyframes blink{0%,100%{border-color:var(--blink);box-shadow:0 0 0 2px color-mix(in srgb,var(--blink) 35%,transparent),var(--shadow)}50%{border-color:var(--blink);box-shadow:0 0 0 4px var(--blink),0 0 22px 4px color-mix(in srgb,var(--blink) 50%,transparent),var(--shadow)}}
.card.t-dec{background:#fbeedd;border-color:#e8c79b;color:#8a4a14;--blink:#c9741f}
.card.t-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-ink)}
.card.t-bad{background:var(--bad-bg);border-color:var(--bad-ln);color:#8f2a1f;--blink:#c4402f}
.smile{flex:none;color:#2e8b3a}
.card.step{min-height:52px;padding:13px 18px;font-size:16.5px;font-weight:500;cursor:default;border-radius:14px;box-shadow:none}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:#e4efe0;color:#2e5a2e;font-size:13px;font-weight:650;display:grid;place-items:center}
.card.final{cursor:default;font-size:19px;justify-content:center;text-align:center}
.card.out{opacity:0;transform:scale(.95);pointer-events:none}
.card.chosen{transform:scale(1.03);animation:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent)}
#foot{flex:none;padding-top:12px;text-align:center;min-height:56px;color:var(--mute);font-size:14px}
#foot button{font:inherit;font-size:17px;font-weight:600;width:100%;padding:16px;border-radius:14px;border:0;background:#3f7d3c;color:#fff;cursor:pointer;animation:in .5s .3s both}
#foot button:active{background:#2e5a2e}
.card.ghost{animation:none;opacity:.08;box-shadow:none;transform:scale(.97);font-size:15.5px;padding:13px 17px;transition:opacity .25s}
.card.ghost.picked{opacity:.22}
.card.ghost:active{opacity:.45}
.card.opt{min-height:76px}
.card.opt,.card.final{margin-block:10px}
.card.step{margin-block:3px}
#list{gap:24px}
#foot .row{display:flex;align-items:center;gap:10px}
#foot .row span{flex:1;text-align:center}
#foot .row button{width:auto;padding:13px 18px;flex:none}
#foot .row button:not(.sec){flex:1}
#foot .row .sec{background:#2e5a2e;color:#fff;border:1.5px solid #2e5a2e;animation:none}
#foot .row .sec:active{background:#244824}
#list{isolation:isolate}
.card{z-index:1}
svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
svg.lines path{fill:none;stroke:#1b2a1b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card.ghost.picked{opacity:.42}
.card.ghost.parent{opacity:1;transform:none;font-size:17.5px;padding:18px 20px;box-shadow:var(--shadow);cursor:default}
.row2{display:flex;gap:12px;width:var(--cw);max-width:100%;align-items:stretch}
.row2 .card{flex:1;width:auto;min-width:0;justify-content:center;text-align:center;margin-block:10px}
.grp{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.grp .row2 .card{margin-block:0}
.card.head{cursor:default;box-shadow:none;font-size:16.5px;font-weight:600}
svg.lines path.faint{animation:none;stroke-dashoffset:0;opacity:.1}
svg.lines path.chosen{animation:none;stroke-dashoffset:0;opacity:.45}
header .logo{flex:none;width:42px;height:42px;border-radius:50%;background:none;object-fit:contain}
.cols{display:flex;gap:12px;width:calc(100% - 12px);align-items:flex-start;margin-top:12px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:28px}
.col .card{max-width:100%;width:100%;justify-content:flex-start}
.card.hang{border-style:dashed;margin-top:16px}
#bBack{display:none!important}
#foot .row .sec{min-width:104px}
#list.first{gap:22px}
#list.first .card{width:100%;max-width:var(--fw,330px);min-height:min(74px,11vh);padding:14px 20px;font-size:18px;font-weight:650;justify-content:center;text-align:center;border-radius:18px}
#list.first .card.opt{margin-block:0}
@media (max-height:640px){#list.first .card{min-height:60px;font-size:16px;padding:10px 16px}}
.card>span:not(.num){min-width:0;flex:1 1 auto;text-wrap:wrap;overflow-wrap:break-word;word-break:normal;hyphens:manual;text-align:inherit}
.links{margin-left:auto;display:flex;gap:9px;align-items:center}
.links a{color:#fff;text-decoration:underline;text-underline-offset:4px;font-size:15px;font-weight:600;padding:6px 3px}
.col .card>span,.row2 .card>span,#list.first .card>span{text-wrap:wrap;overflow-wrap:break-word}
.popup{position:relative;z-index:1;flex:0 0 auto;width:var(--pw);background:#fff;border-radius:20px;box-shadow:0 10px 30px -10px rgba(35,60,35,.35),var(--shadow);border:1px solid var(--line);overflow:hidden;animation:in .5s cubic-bezier(.3,.8,.3,1) both,pbl 1.3s ease-in-out infinite;text-align:left;pointer-events:none}
.popup b{display:block}.popup small{display:block;color:#7b8379;font-size:12.5px;line-height:1.35;margin-top:2px}
.pp-h{display:flex;gap:12px;align-items:flex-start;padding:16px;background:#fcf5dc}
.pp-h b{color:#8a5a0b;font-size:17px;line-height:1.2}
.pp-ic{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center}
.pp-x{margin-left:auto;color:#6d736c;font-size:15px;padding:2px 4px}
.pp-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.pp-p{display:flex;gap:12px;align-items:center}
.pp-p img{width:48px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.pp-p b{font-size:15px;line-height:1.25}
.pp-p small{font-family:ui-monospace,Menlo,monospace}
.pp-t{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pp-t>div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-size:14.5px;border-bottom:1px solid var(--line)}
.pp-t>div b{display:inline}
.pp-t>.pp-e{background:#fcf5dc;border-bottom:0;font-weight:650;color:#6d4a0b}
.pp-e i{font-style:normal;background:#e0a23a;color:#fff;border-radius:99px;padding:4px 12px;font-size:13.5px}
.pp-l{color:#8a5a0b;font-size:12.5px;font-weight:650}
.pp-ph{border:1.5px dashed #bfc4bb;border-radius:12px;background:#f3f4f1;padding:30px 12px;display:grid;place-items:center;margin-top:-6px}
.pp-ph span{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1.5px solid #222;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600}
.pp-a{display:flex;gap:10px}
.pp-a span{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;font-size:14px;font-weight:600}
.pp-a .off{background:#e6e6e3;border-color:#e6e6e3;color:#a2a69f}
@keyframes pbl{0%,100%{box-shadow:0 0 0 2px rgba(224,162,58,.35),0 10px 30px -10px rgba(35,60,35,.35);border-color:#ecd9a6}50%{box-shadow:0 0 0 5px #e0a23a,0 0 26px 5px rgba(224,162,58,.55),0 10px 30px -10px rgba(35,60,35,.35);border-color:#e0a23a}}
.hangimg{position:relative;z-index:1;flex:0 0 auto;margin-top:30px;width:var(--iw);border:3px solid #9fd29a;border-radius:18px;background:#fff;padding:6px;cursor:pointer;animation:in .5s cubic-bezier(.3,.8,.3,1) both,ibl 1.3s ease-in-out infinite}
.hangimg img{width:100%;display:block;border-radius:11px}
.hangimg small{display:block;text-align:center;color:#66726a;font-size:12.5px;padding:6px 0 2px}
@keyframes ibl{0%,100%{border-color:#a9d6a4;box-shadow:0 0 0 0 rgba(63,154,60,0)}50%{border-color:#2f8f3a;box-shadow:0 0 0 5px rgba(63,154,60,.35),0 0 24px rgba(63,154,60,.5)}}
#lb{position:fixed;inset:0;z-index:100;background:rgba(10,20,10,.9);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#lb[hidden]{display:none}
#lb img{width:1200px;max-width:none;display:block;margin:64px auto 40px;background:#fff;border-radius:12px}
#lbx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:101;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#222;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer}
@media (max-width:430px){h1{font-size:18px}.links a{font-size:13.5px}}
@keyframes pbl2{0%,100%{box-shadow:0 0 0 2px rgba(224,58,54,.3),0 10px 30px -10px rgba(35,60,35,.35);border-color:#f0c4c2}50%{box-shadow:0 0 0 5px #e03a36,0 0 26px 5px rgba(224,58,54,.5),0 10px 30px -10px rgba(35,60,35,.35);border-color:#e03a36}}
.popup.miss{animation:in .5s cubic-bezier(.3,.8,.3,1) both,pbl2 1.3s ease-in-out infinite}
.popup.miss .pp-h{background:#fde9e7}
.popup.miss .pp-h b{color:#d4322e}
.popup.miss .pp-t>.pp-e{background:#fde9e7;color:#c4302b}
.popup.miss .pp-e i{background:#e03a36}
.popup.miss .pp-a .ack{background:#e03a36;border-color:#e03a36;color:#fff}
.popup.ns .pp-h{background:#fff;border-bottom:1px solid var(--line)}
.popup.ns .pp-h b{color:#222}
.popup.ns .pp-mm{margin-left:auto;flex:none;border:1.5px solid #e03a36;color:#d4322e;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:650}
.popup.ns .pp-p b{font-size:15px}
.pp-l2{font-size:14px;font-weight:650;color:#222;margin-bottom:-4px}
.pp-pr{display:flex;gap:12px;align-items:stretch}
.pp-pic{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden}
.pp-pic img{width:100%;height:100%;object-fit:cover;display:block}
.pp-pic i{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);color:#444;font-style:normal;font-size:10px;display:grid;place-items:center}
.pp-add{width:80px;height:74px;border:1.5px solid #e03a36;border-radius:10px;color:#d4322e;display:grid;place-items:center;font-size:14px;font-weight:650}
#list.first .card.lm,.card.lm{background:#2e5a2e;color:#fff;border-color:#2e5a2e;font-weight:700}
#list.first .card.lm{font-size:27px;min-height:min(100px,14vh);padding:18px 24px;max-width:var(--lw,340px);letter-spacing:.01em}
.hangimg.soft{width:min(100%,250px);animation:in .5s cubic-bezier(.3,.8,.3,1) both,ibl2 2.8s ease-in-out infinite}
@keyframes ibl2{0%,100%{border-color:#b9dbb5;box-shadow:0 0 0 0 rgba(63,154,60,0)}50%{border-color:#62ae5e;box-shadow:0 0 0 3px rgba(63,154,60,.16)}}
.hero{flex:0 0 auto;width:var(--hw);animation:in .6s cubic-bezier(.3,.8,.3,1) both;margin-bottom:4px}
.hero svg{display:block;overflow:visible}
.carry{animation:carry 2.2s ease-in-out infinite}
@keyframes carry{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
/* ---- responsive: phone (default) / tablet / laptop ---- */
.col .card{padding:12px 12px;font-size:15.5px}
.row2 .card{padding:14px 10px}
@media (max-width:599px){.col .num{width:22px;height:22px;font-size:12px}.col .card{gap:7px}}
@media (min-width:600px){
  :root{--cw:min(calc(100% - 80px),460px);--pw:min(100%,400px);--iw:min(100%,460px);--hw:min(100%,420px);--fw:390px;--lw:410px}
  main{padding:20px 20px 14px}
  .col .card{padding:14px 16px;font-size:16.5px}
}
@media (min-width:900px){
  :root{--cw:min(calc(100% - 120px),560px);--pw:min(100%,460px);--iw:min(100%,600px);--hw:min(100%,500px);--fw:460px;--lw:480px}
  header{padding:14px 40px}
  header h1{font-size:25px}
  header .logo{width:46px;height:46px}
  .links{gap:14px}
  .links a{font-size:16.5px}
  main{max-width:960px;padding:24px 32px 16px}
  .card{font-size:19px;padding:21px 28px;border-radius:20px}
  .card.step{font-size:18px;padding:15px 22px;min-height:58px}
  .card.opt{min-height:88px}
  .card.ghost{font-size:17px}
  .card.ghost.parent{font-size:19px;padding:21px 28px}
  .col .card,.row2 .card{padding:16px 20px;font-size:18px}
  #list.first .card{font-size:21px;min-height:84px}
  #list.first .card.lm{font-size:34px;min-height:112px}
  #list{gap:28px}
  .num{width:30px;height:30px;font-size:14px}
  #foot{font-size:15.5px;min-height:64px}
  #foot button{font-size:18px;padding:18px}
  #foot .row button{padding:15px 26px}
  .pp-h b{font-size:19px}.pp-b{padding:20px}.pp-t>div{font-size:16px}.pp-p b{font-size:16.5px}.pp-a span{font-size:15.5px}
}
#list{padding-inline:8px}
.row2 .card{min-width:0;overflow:visible}
@media (max-width:520px){header{flex-wrap:wrap;row-gap:4px}.links{margin-left:0;flex:1 1 100%;gap:16px;padding-left:2px}}
</style>
</head>

function screenFor(x){
  if(x==='ex2')return screenFor('e0');
  if(x==='lm')return {steps:['start'],plain:true,options:kids.start};
  if(x==='without')return {steps:[],options:kids.without,image:IMGQ,soft:true};
  if(x==='ifm')return {steps:[],options:[],cols:kids[x].map(h=>{const l=[h];let c=h,n;while((n=kids[c].find(k=>chain.has(k)))){l.push(n);c=n}return l})};
  if(chain.has(x)){                       // a whole procedure: show every step together
    const steps=[];let cur=x,nx;
    while((nx=kids[cur].find(k=>chain.has(k)))){steps.push(nx);cur=nx}
    return {steps,options:kids[cur].filter(k=>!chain.has(k)),hang:HANG[x]||[],popup:x==='e0'?'extra':x==='m0'?'miss':x==='ins'?'ns':null,image:({e0:IMG,m0:IMGM,d0:IMGD})[x]||null};
  }
  if(kids[x].length===1&&(N[kids[x][0]].type==='dec'||kids[x][0]==='audit'))return {steps:[kids[x][0]],plain:true,options:kids[kids[x][0]],dec:N[kids[x][0]].type==='dec'};
  return kids[x].length?{steps:[],options:kids[x],hang:HANG[x]||[]}:{steps:[],options:[],final:x};

  hist.forEach((s,j)=>{
    const chosen=(hist[j+1]||cur).pickedId;let head=prevPicked,thisPicked=null;
    if(s.plain){s.steps.forEach(sid=>{const sg=ghost(sid,true);sg._plain=true;list.appendChild(sg);if(head)trail.push({from:head,to:[sg]});head=sg})}
    const gs=[];
    s.options.forEach(id=>{
      const hit=id===chosen||(isFork(id)&&kids[id].includes(chosen));const g=ghost(id,hit);
      g.onclick=()=>{if(busy)return;hist=hist.slice(0,j);cur=s;const nsc=screenFor(id);nsc.pickedId=id;show(nsc)};
      if(hit){thisPicked=g;if(j===hist.length-1){pickedGhost=g;g.classList.add('parent')}}
      g._hit=hit;list.appendChild(g);gs.push(g);
    });
    if(head)trail.push({from:head,to:gs});
    prevPicked=thisPicked;
  });
  const anchor=list.children.length;
  if(sc===START){const h=document.createElement('div');h.className='hero';h.innerHTML=heroSVG();list.appendChild(h)}
  let k=0;const dl=()=>Math.min(80+(k++)*130,1200),stepEls=[],optEls=[];
  if(sc.final){const f=card(sc.final,'final',dl());list.appendChild(f);optEls.push(f)}
  if(sc.popup){const p=sc.popup==='miss'?popupMiss(dl()):sc.popup==='ns'?popupNS(dl()):popupEl(dl());list.appendChild(p);stepEls.push(p)}
  sc.steps.forEach((id,i)=>{const c=card(id,'step'+(id==='lm'?' lm':''),dl(),sc.plain?0:i+1);list.appendChild(c);stepEls.push(c)});
  const colEls=[];
  if(sc.cols){
    const wrap=document.createElement('div');wrap.className='cols';
    const divs=sc.cols.map(()=>{const d=document.createElement('div');d.className='col';wrap.appendChild(d);colEls.push([]);return d});
    const depth=Math.max(...sc.cols.map(c=>c.length));
    for(let d=0;d<depth;d++)sc.cols.forEach((c,ci)=>{if(c[d]){const e=card(c[d],'step',dl(),d+1);divs[ci].appendChild(e);colEls[ci].push(e)}});
    list.appendChild(wrap);
  }
  const mk=id=>{const c=card(id,'opt'+(kids[id].length?' go':'')+(id==='lm'?' lm':''),dl());c.onclick=()=>pick(id,c);return c};
  const rowOf=ids=>{const r=document.createElement('div');r.className='row2';const cs=ids.map(mk);cs.forEach(c=>r.appendChild(c));return {r,cs}};
  const groups=[];
  if(sc.options.length===2&&(sc.options.every(leaf)||sc.dec)){const {r,cs}=rowOf(sc.options);list.appendChild(r);optEls.push(...cs)}
  else sc.options.forEach(id=>{
    if(isFork(id)){
      const w=document.createElement('div');w.className='grp';
      const h=card(id,'head',dl());w.appendChild(h);
      const {r,cs}=rowOf(kids[id]);w.appendChild(r);list.appendChild(w);optEls.push(h);groups.push({h,cs});
    }else{const c=mk(id);list.appendChild(c);optEls.push(c)}
  });
  (sc.hang||[]).forEach(id=>list.appendChild(card(id,'step hang',dl())));
  if(sc.image)list.appendChild(hangImg(dl(),sc.image,sc.soft));
  const row=document.createElement('div');row.className='row';
  if(hist.length){const bk=document.createElement('button');bk.className='sec';bk.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px"><path d="M15 5l-7 7 7 7"/></svg>Back';bk.onclick=()=>bBack.onclick();row.appendChild(bk)}
  if(sc.options.length){const t=document.createElement('span');t.textContent='Tap an option to continue';row.appendChild(t)}
  else{const b=document.createElement('button');b.textContent='Start over';b.onclick=()=>{hist=[];cur=null;show(START)};row.appendChild(b)}
  foot.appendChild(row);
  busy=false;
  syncBrowser();
  const first=list.children[anchor],last=list.lastElementChild,smooth=anchor>0;
  list.scrollTop=0;
  requestAnimationFrame(()=>{
    const h=last.offsetTop+last.offsetHeight-first.offsetTop,free=list.clientHeight-h,pad=Math.max(6,free/2);
    list.style.paddingTop=pad+'px';list.style.paddingBottom=pad+'px';
    const top=free>0?first.offsetTop-free/2:first.offsetTop-70;   /* centre the active block */
    list.scrollTo({top:Math.max(0,top),behavior:smooth?'smooth':'auto'});
    drawLines(pickedGhost,stepEls,optEls,groups,trail,colEls);
  });
}
let actx;
function warn(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    [[880,0],[622,.19],[880,.38],[622,.57]].forEach(([f,o])=>{
      const os=actx.createOscillator(),g=actx.createGain();os.type='square';os.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.14,t+o+.015);g.gain.setValueAtTime(.14,t+o+.13);g.gain.exponentialRampToValueAtTime(.0001,t+o+.17);
      os.connect(g);g.connect(actx.destination);os.start(t+o);os.stop(t+o+.18);
    });
  }catch(e){}
}
function pick(id,el){
  if(busy)return;busy=true;
  if(kids.disc.includes(id)){try{navigator.vibrate&&navigator.vibrate([120,60,120,60,120,60,240])}catch(e){}warn()}
  list.querySelectorAll('.card:not(.ghost)').forEach(c=>c.classList.add(c===el?'chosen':'out'));
  setTimeout(()=>{const sc=screenFor(id);sc.pickedId=id;show(sc)},340);
}
const START={steps:[],options:['lm']};
bBack.onclick=()=>{if(busy||!hist.length)return;busy=true;const p=hist.pop();show(p,false)};
/* phone / browser Back button walks back through the same steps as the in-app Back */
let bd=0,skip=false;
try{history.replaceState({d:0},'')}catch(e){}
function syncBrowser(){
  const D=hist.length;
  try{
    if(D>bd){for(let i=bd+1;i<=D;i++)history.pushState({d:i},'')}
    else if(D<bd){skip=true;history.go(D-bd)}
  }catch(e){skip=false}
  bd=D;
}
addEventListener('popstate',e=>{
  if(skip){skip=false;return}
  const d=e.state&&typeof e.state.d==='number'?e.state.d:0;
  bd=d;
  if(d<hist.length){let p;while(hist.length>d)p=hist.pop();busy=true;show(p,false)}
  else syncBrowser();
});
show(START);
/* locked: no zoom / pan gestures */
['gesturestart','gesturechange','contextmenu'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('wheel',x=>{if(x.ctrlKey)x.preventDefault()},{passive:false});
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f3ee"><title>Crate handling · flow map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f3ee;--ink:#283229;--muted:#737a70;--green:#58765d;--line:#d6ddd4;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "DM Sans",system-ui,sans-serif}header{padding:25px clamp(20px,4vw,54px) 17px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--green);font-weight:700}h1{font:400 clamp(28px,4vw,42px)/1 Newsreader,Georgia,serif;letter-spacing:-.03em;margin:7px 0}.sub{color:var(--muted);margin:0;font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}.actions button{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}.actions button:hover,.actions button.on{border-color:#93a78f;background:#f1f6ef}.status{padding:0 clamp(20px,4vw,54px) 12px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #58765d18}.board{height:calc(100vh - 145px);min-height:440px;background:#fbfaf6;border-top:1px solid #e1e3dc;overflow:hidden;position:relative}.network{height:100%;width:100%;background-color:#fbfaf6;background-image:radial-gradient(#d8ddd4 0.7px,transparent .7px);background-size:22px 22px}.vis-network:focus{outline:none}.vis-network canvas{outline:none}.edit-hint{position:absolute;right:16px;bottom:13px;background:#fffefaed;border:1px solid #e0e3dc;border-radius:20px;color:#777e74;font-size:11px;padding:6px 11px;pointer-events:none}.vis-tooltip{font:12px "DM Sans",sans-serif!important;color:#283229!important;background:#fffefa!important;border:1px solid #d6ddd4!important;border-radius:8px!important;box-shadow:0 8px 24px #27352615!important;padding:8px 11px!important}@media(max-width:650px){header{align-items:start;flex-direction:column}.actions{align-self:flex-end}.board{height:calc(100vh - 195px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<header><div><div class="eyebrow">Operations · interactive flow</div><h1>Crate handling</h1><p class="sub">Click a step to reveal what follows. Branches appear together.</p></div><div class="actions"><button id="edit" aria-pressed="false">Arrange nodes</button><button id="fit">Fit flow</button><button id="reset">Start over</button></div></header>
<div class="status"><span class="dot"></span><span id="message">Begin with the first step.</span></div>
<div class="board"><div class="network" id="network" aria-label="Crate handling flow chart"></div><div class="edit-hint" id="hint">Drag to pan · scroll to zoom</div></div>
<script>
const flow={
 start:{title:'Crate received',next:['unload'],level:0},
 unload:{title:'Unload crates',next:['scan','not-received'],level:1},
 scan:{title:'Scan crate barcode',next:['labelled','unlabelled'],level:2},
 'not-received':{title:'No crate received from FC',detail:'Full crate missing → FC accountability',end:true,level:2},
 labelled:{title:'Crate with customer-level stickers and barcode',next:['wbc'],level:3},
 unlabelled:{title:'Crate without customer-level stickers and barcode',detail:'System shows trip number when crate barcode is scanned.',next:['same-hub','different-hub'],level:3},
 'same-hub':{title:'Crate belongs to same hub',detail:'Add it to the respective trip.',next:['wbc'],level:4},
 'different-hub':{title:'Crate belongs to a different hub',detail:'Add extra → return to FC. Same quantity should reach FC; no missing is expected.',end:true,level:4},
 wbc:{title:'Weight-based crossing (WBC) starts',detail:'Compare expected and actual quantity.',next:['pass','fail'],level:5},
 pass:{title:'Pass · expected = actual',next:['pass-clear','pass-missing'],level:6},
 fail:{title:'Does not pass',detail:'Continue to product-level audit.',next:['audit'],level:6},
 'pass-clear':{title:'No missing in LM Delivery',end:true,good:true,level:7},
 'pass-missing':{title:'Missing in LM Delivery',detail:'Compare with the threshold.',next:['over-threshold','within-threshold'],level:7},
 audit:{title:'Product-level audit',next:['no-discrepancy','discrepancies'],level:7},
 'over-threshold':{title:'More than threshold',detail:'Expected extra from DH → if extra cannot be obtained → debit from DH.',end:true,level:8},
 'within-threshold':{title:'Within threshold',next:['okay'],level:8},
 okay:{title:'Okay',end:true,good:true,level:9},
 'no-discrepancy':{title:'No discrepancy',next:['audit-clear','audit-missing'],level:8},
 discrepancies:{title:'Discrepancies found',detail:'Choose the finding identified in the product-level audit.',next:['not-scan','verified-missing','dead-weight','missing-identified','damage','extra'],level:8},
 'audit-clear':{title:'No missing in LM Delivery',end:true,good:true,level:9},
 'audit-missing':{title:'Missing in LM Delivery',detail:'RCA required or debit DH / cross-dock.',end:true,level:9},
 'not-scan':{title:'Item not scanned',detail:'Recheck → mark missing → take image of available product.',end:true,level:9},
 'verified-missing':{title:'Scanned item · missing in delivery',detail:'RCA required or debit DH / cross-dock.',end:true,level:9},
 'dead-weight':{title:'Dead weight difference',detail:'Complete dead weight correction.',end:true,level:9},
 'missing-identified':{title:'Missing identified',detail:'Recheck → verify quantity → confirm missing → capture image → update weight and system → mark missing in LM Delivery → RCA or debit DH.',end:true,level:9},
 damage:{title:'Damage identified',detail:'Recheck → remove damage → take new crate → capture image → tag crate → update dead weight and system.',end:true,level:9},
 extra:{title:'Extra identified',detail:'Recheck → remove extra → new crate → tag and capture image → stage → set next-day expectations → load to canter → return to FC. If missing, RCA required.',end:true,level:9}
};
const container=document.querySelector('#network'),nodes=new vis.DataSet(),edges=new vis.DataSet();let visible=new Set(['start']),arrange=false;
const network=new vis.Network(container,{nodes,edges},{
 layout:{hierarchical:{enabled:true,direction:'UD',sortMethod:'directed',levelSeparation:145,nodeSpacing:225,treeSpacing:250,blockShifting:true,edgeMinimization:true,parentCentralization:false}},
 physics:{enabled:false},interaction:{dragNodes:false,dragView:true,zoomView:true,hover:true,hoverConnectedEdges:false,selectConnectedEdges:false,multiselect:false},
 nodes:{shape:'box',shapeProperties:{borderRadius:12},margin:{top:13,right:16,bottom:13,left:16},widthConstraint:{minimum:200,maximum:242},font:{face:'DM Sans',size:14,color:'#283229',multi:true},borderWidth:1.3,shadow:{enabled:true,color:'rgba(39,53,38,.07)',size:9,x:0,y:3},color:{background:'#fffefa',border:'#d6ddd4',highlight:{background:'#f7faf5',border:'#78937a'},hover:{background:'#fffefa',border:'#78937a'}},chosen:{node:false}},
 edges:{width:1.2,color:{color:'#bdc7ba',highlight:'#80977f',hover:'#80977f'},smooth:{enabled:true,type:'cubicBezier',roundness:.35},arrows:{to:{enabled:false}},selectionWidth:0,hoverWidth:0},
 });
function nodeData(id){const d=flow[id],label=`${d.title}${d.detail?'\n'+d.detail:''}`;return{id,label,level:d.level,title:d.detail?`${d.title}\n${d.detail}`:d.title,shape:'box',borderWidth:d.end?1.4:1.2,color:d.end?{background:'#f2f7ef',border:'#c7d7c3'}:undefined,font:d.good?{face:'DM Sans',size:14,color:'#426b48',multi:true,bold:{color:'#426b48'}}:undefined};}
function reveal(id){if(arrange)return;const next=flow[id].next||[];if(!next.length)return;const added=[];for(const child of next)if(!visible.has(child)){visible.add(child);added.push(child)}for(const child of added){nodes.add(nodeData(child));edges.add({id:`${id}-${child}`,from:id,to:child})}if(added.length){document.querySelector('#message').textContent=`${added.length===1?'Next step revealed':'All '+added.length+' branch options revealed'}. Click any new step to continue.`;network.fit({nodes:added,animation:{duration:450,easingFunction:'easeInOutQuad'}})}else document.querySelector('#message').textContent='These next steps are already visible.';}
function reset(){visible=new Set(['start']);nodes.clear();edges.clear();nodes.add(nodeData('start'));network.fit({animation:{duration:400,easingFunction:'easeInOutQuad'}});document.querySelector('#message').textContent='Begin with the first step.'}
network.on('click',params=>{if(params.nodes.length)reveal(params.nodes[0])});
document.querySelector('#edit').addEventListener('click',e=>{arrange=!arrange;e.currentTarget.classList.toggle('on',arrange);e.currentTarget.setAttribute('aria-pressed',String(arrange));e.currentTarget.textContent=arrange?'Done arranging':'Arrange nodes';network.setOptions({layout:{hierarchical:{enabled:!arrange,direction:'UD',sortMethod:'directed',levelSeparation:145,nodeSpacing:225,treeSpacing:250,blockShifting:true,edgeMinimization:true,parentCentralization:false}},interaction:{dragNodes:arrange,dragView:true}});document.querySelector('#hint').textContent=arrange?'Drag nodes to rearrange the flow':'Drag to pan · scroll to zoom';document.querySelector('#message').textContent=arrange?'Arrange mode is on. Drag any node to reposition it.':'Click a step to reveal what follows.'});
document.querySelector('#fit').addEventListener('click',()=>network.fit({animation:{duration:400,easingFunction:'easeInOutQuad'}}));document.querySelector('#reset').addEventListener('click',reset);reset();
</script>
</body></html>
